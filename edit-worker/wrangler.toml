name = "rannia-artsite-edit-worker"
main = "src/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

# Public-safe vars. Secrets (ANTHROPIC_API_KEY, GITHUB_TOKEN, NETLIFY_API_TOKEN)
# are set with `wrangler secret put NAME` — never committed here.
[vars]
CF_ACCESS_TEAM   = "intellihq.cloudflareaccess.com"
CF_ACCESS_AUD    = "cdb84caa59b15903e527a3ddaf27022f1791ae22df08405b02b43306d62ea440,dee121ea272d56c65aef2c2652e7f4e6f8578044344511edc474293b5fc4ee75"
ALLOWED_EMAILS   = "joe@intelli.com.au,joe.kazzi@candasurveyors.com.au,r.katrib90@gmail.com"
NETLIFY_SITE_ID  = "e8b2234a-4e94-42b1-a559-4c5d16080ad9"

[[kv_namespaces]]
binding = "EDITOR_SESSIONS"
id      = "08cba64a3a68436ca895d76911f81f66"

# Custom domain routing — set once the Worker is deployed. Until then,
# the *.workers.dev URL is fine for the smoke test.
# [[routes]]
# pattern = "edit.rannia-art-review.example"
# custom_domain = true

# Observability + limits. On the Paid plan the defaults are fine; the CPU cap
# only matters for tight loops (which we don't have — waiting on Anthropic
# doesn't count).
[observability]
enabled = true
