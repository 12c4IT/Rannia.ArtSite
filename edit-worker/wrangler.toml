name = "rannia-artsite-edit-worker"
main = "src/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

# Public-safe vars. Secrets (ANTHROPIC_API_KEY, GITHUB_TOKEN, NETLIFY_API_TOKEN)
# are set with `wrangler secret put NAME` — never committed here.
[vars]
CF_ACCESS_TEAM   = "REPLACE_WITH_TEAM_DOMAIN"           # e.g. intelli.cloudflareaccess.com
CF_ACCESS_AUD    = "REPLACE_WITH_AUD_TAG"               # from the Access application
ALLOWED_EMAILS   = "REPLACE_WITH_COMMA_SEPARATED_EMAILS" # e.g. joe@example.com,rannia@example.com
NETLIFY_SITE_ID  = "REPLACE_WITH_REVIEW_SITE_ID"        # rannia-art-review.netlify.app

# KV namespace for per-session request counters.
# Create with: wrangler kv namespace create EDITOR_SESSIONS
# Then paste the returned `id` here.
[[kv_namespaces]]
binding = "EDITOR_SESSIONS"
id      = "REPLACE_WITH_KV_NAMESPACE_ID"

# Custom domain routing — set once the Worker is deployed. Until then,
# the *.workers.dev URL is fine for the smoke test.
# [[routes]]
# pattern = "edit.rannia-art-review.example"
# custom_domain = true

# Observability + limits. On the Paid plan the defaults are fine; the CPU cap
# only matters for tight loops (which we don't have — waiting on Anthropic
# doesn't count).
[observability]
enabled = true
